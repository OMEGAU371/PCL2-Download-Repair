name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Build, test, package
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PCL2-Download-Repair
          path: |
            artifacts/PCL2-Download-Repair.zip
            artifacts/PCL2-Download-Repair.zip.sha256
            artifacts/self-test.json
      - name: Attest release package
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/PCL2-Download-Repair.zip
      - name: Publish prerelease
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" artifacts/PCL2-Download-Repair.zip artifacts/PCL2-Download-Repair.zip.sha256 artifacts/self-test.json --verify-tag --prerelease --title "PCL2 Download Repair $env:GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
